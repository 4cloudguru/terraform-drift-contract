---
name: Release Please

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Non-cancelling: a run that reaches the tag/release-cutting step is producing
# an external, hard-to-undo artifact and must be allowed to finish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # release-please cannot run on the default GITHUB_TOKEN here. Events
      # raised by GITHUB_TOKEN do not start new workflow runs, so the release
      # PR would never get `Build, test, dist sync` or `Conventional PR Title`
      # — both required contexts on main — and could never be merged. A GitHub
      # App token raises real events, so the release PR is checked like any
      # other. Fail with an actionable message rather than a 401 from the
      # token step.
      - name: Verify the release App credentials are configured
        env:
          APP_ID: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::Missing release App credentials. Set the repository variable RELEASE_DISPATCH_APP_ID and the repository secret RELEASE_DISPATCH_APP_KEY (the same App 4cloudguru/pipeline-task-core uses), and install that App on this repository with contents:write and pull-requests:write."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
          # Scope the token to what release-please needs rather than inheriting
          # the app's blanket installation permissions. The installation is NOT
          # granted `issues`, so requesting it 422s the token step.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
