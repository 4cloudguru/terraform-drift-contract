---
name: CodeQL

# `tsc --noEmit` is a type check, not a security analysis. This package is the
# only redaction control between a plaintext value in an attacker-influenceable
# plan and a payload that leaves two different CI systems' runners, and nothing
# in this repo performed any taint-shaped analysis of that path.
#
# The schedule matters as much as the PR trigger: dependency-review only
# evaluates dependencies a PR *changes*, so it is silent about an advisory
# published tomorrow against something already pinned in the lockfile.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "33 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # security-extended picks up the injection queries the default suite
          # leaves out, which is the whole reason this is here.
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
