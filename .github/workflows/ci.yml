name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # An advisory against something already in the lockfile lands with no PR open.
  # dependency-review only evaluates what a PR *changes*, so without a schedule
  # nothing here ever re-asks the question after the merge.
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, dist sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # SHA-pinned with a trailing version comment: a tag is mutable, so `@v4`
      # let whoever controls the tag change what this job runs. zizmor's
      # `ref-version-mismatch` audit checks the pin and the comment agree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout needs git credentials — the dist diff below
          # is a local `git diff`. Leaving them in .git/config is zizmor's
          # `artipacked` audit.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # --ignore-scripts: `tsc` and `vitest` need no install lifecycle script, and
      # this job installs the toolchain into the same workspace that then produces
      # the dist/ two CI systems execute. Matches publish.yml.
      #
      # Carries an id and tees its output because the advisory at the foot of
      # this job has to say WHICH npm ci failure this was. `npm ci` answers a
      # lockfile that disagrees with package.json by refusing the whole tree
      # up front: it installs nothing, exits, and leaves every later step
      # `skipped` rather than `failure` — so an advisory keyed only on those
      # later steps stays silent on the one failure that caused all of them.
      # pipefail so tee cannot swallow npm's exit code.
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"
      - run: npm test
      # Executes the advisory's own `run:` block, lifted out of this file,
      # against real npm output. The advisory is a diagnosis, and the branch
      # that tells a lockfile refusal from any other npm ci failure keys on
      # npm's exact wording -- which will change without telling anyone here.
      - name: The Dependabot advisory still matches npm's wording
        run: npm run test:advisory

      # The package ships zero runtime dependencies, so --omit=dev would audit an
      # empty set; the exposure worth watching is the build/test toolchain that
      # runs in this workspace.
      - run: npm audit --audit-level=high
      # Split from the staleness diff below so the two failures stay tellable
      # apart. "This cannot be compiled at all" and "the compile is fine but the
      # committed copy is behind it" need opposite responses, and collapsing
      # them onto one red step is what makes a mechanical dependency bump read
      # as a broken pull request. It also mattered for the advisory: with the
      # two joined there was no outcome that meant "builds cleanly, only the
      # committed dist/ is missing", so the advice could not be written.
      - name: Rebuild the dist
        id: rebuild
        run: npm run build

      - name: Fail if the committed dist is stale
        id: dist-sync
        # Git-dependency consumers use the committed dist/ — it must match src/.
        #
        # `git diff` compares TRACKED content only, so a file the compiler newly
        # emits into dist/ is invisible to it: the moment src/ grows a module,
        # `npm run build && git commit -a` lands the tracked edits and drops the
        # new dist/ file (`commit -a` never stages new paths), and from the next
        # run onwards the gate is green over a dist/ whose index requires a module
        # that is not in the tree. Stage the directory first and diff the INDEX so
        # the check sees added, modified and deleted paths alike; --force covers a
        # path a .gitignore rule (e.g. *.tsbuildinfo) would otherwise hide.
        run: |
          git add --force -A -- dist
          if ! git diff --cached --exit-code -- dist; then
            echo "::error::dist is out of date — run 'npm run build' and commit the result."
            exit 1
          fi

      # Dependabot edits package.json and the lockfile and never runs a build, so
      # every bump that changes compiled output arrives with a stale dist and is
      # red by construction. This step does not fix that; it says which of the
      # three kinds of red it is and what to do about it, in the log of the run
      # that failed.
      #
      # The bot test is `github.event.pull_request.user.login`, not
      # `github.actor`. github.actor is whoever most recently caused a run — a
      # re-run, or a push onto the branch — so a third party can make it read
      # `dependabot[bot]` on a pull request Dependabot did not author. That is
      # zizmor's `bot-conditions` audit. Nothing privileged hangs off this
      # condition today (it only decides which message prints, in a job holding
      # `contents: read`), but it is the gate anything privileged would reuse.
      # Paired with a same-repository head check: Dependabot branches live in
      # THIS repo, so a head ref that does not is not the case this advice is for.
      #
      # github.head_ref reaches the shell through env, never through `${{ }}`
      # interpolation into the script body: a branch name is attacker-chosen
      # text, and pasting it into a `run:` block is a shell-injection sink.
      - name: What to do about this Dependabot bump
        if: >-
          always() &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (steps.install.outcome == 'failure' ||
           steps.rebuild.outcome == 'failure' ||
           steps.dist-sync.outcome == 'failure')
        env:
          HEAD_REF: ${{ github.head_ref }}
          INSTALL: ${{ steps.install.outcome }}
          REBUILD: ${{ steps.rebuild.outcome }}
          NPM_CI_LOG: ${{ runner.temp }}/npm-ci.log
        run: |
          if [ "$INSTALL" = "failure" ]; then
            # Read back what npm actually printed instead of inferring the
            # cause from the fact that install failed. An advisory that names a
            # specific defect it has not checked for is worse than a generic
            # one: it sends the reader to regenerate a lockfile that was never
            # the problem, with the authority of a diagnosis.
            if grep -q "can only install packages when your package.json and package-lock.json" "$NPM_CI_LOG"; then
              missing=$(sed -n 's/.*Missing: \(.*\) from lock file.*/\1/p' "$NPM_CI_LOG" | paste -sd', ' -)
              echo "::error::Dependabot's lockfile update is incomplete: npm ci refused the tree because package-lock.json disagrees with package.json (missing: ${missing:-see the step log}). Nothing was installed, so every later step in this job is skipped rather than failed -- the rest of the red here is a consequence of this one break, not separate problems. The usual cause is optional platform-specific binaries dropped from a transitive bump, which are absent from the lockfile but still required on other architectures. To land it: git fetch origin \"$HEAD_REF\" && git switch \"$HEAD_REF\" && npm install --package-lock-only && git commit -am 'fix(deps): complete the lockfile for this bump' && git push. Check the diff adds only the missing entries before pushing -- if it moves other versions, this is not that failure."
            else
              echo "::error::npm ci failed, so nothing else in this job ran and the rest of the red here is a consequence of it rather than independent findings. This was NOT a lockfile-sync refusal, so neither a rebuild nor 'npm install --package-lock-only' is indicated -- read the 'Install dependencies' step above for npm's actual error before acting."
            fi
          elif [ "$REBUILD" = "failure" ]; then
            echo "::error::This bump does not merely need a rebuild -- the package cannot be built from it. tsc failed against the bumped dependency tree, so committing a rebuilt dist/ is not available as a fix and would not be one. Read the 'Rebuild the dist' step above for the compile errors. Close the PR or pin the dependency until upstream is fixed."
          else
            echo "::notice::This bump compiles cleanly and the only thing missing is the committed dist/. Two CI systems consume that directory from git, so it has to be committed rather than built on demand. To land it: git fetch origin \"$HEAD_REF\" && git switch \"$HEAD_REF\" && npm ci && npm run build && git commit -am 'build: rebuild dist for this dependency bump' && git push"
          fi

  # Nothing in this repo would previously have caught the missing `permissions:`
  # floor in pr-checks.yml, an unpinned `uses:`, or a future edit that
  # reintroduces a script-injection-prone `${{ }}` expansion. Two CI systems
  # compile code from this package; these are the cheapest checks that keep the
  # workflows themselves honest.
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        # Downloads the release asset and verifies it against actionlint's own
        # published SHA256 before extracting, rather than the convenience install
        # script, which pipes curl straight into tar with no integrity check.
        # Matches the sibling repos' verify-before-extract convention.
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: Scan Workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        # DO NOT drop this `with:` block. `advanced-security` defaults to TRUE,
        # which selects --format=sarif -- and there zizmor EXITS 0 WHATEVER IT
        # FINDS. The job goes green and the findings arrive as code-scanning
        # alerts instead, so the gate silently becomes a reporter. This repo was
        # one of five in that state: terraform-drift-contract's "Scan Workflows
        # (zizmor)" reported success on main with three findings open.
        #
        # The version is named rather than left to the action's `latest` default.
        # `latest` is safe -- an alias inside a digest table frozen by the
        # action's own SHA pin, not a tag resolved at runtime -- but it is
        # illegible: the scanner version would appear nowhere in this repository,
        # and bumping the action SHA would silently change which zizmor runs.
        with:
          advanced-security: false
          version: "1.29.0"
          annotations: true

  # Second gate, same family: zizmor audits workflow SECURITY, this audits
  # workflow HARDENING -- pins labelled, jobs bounded by a timeout,
  # harden-runner first, npm installs refusing dependency scripts.
  #
  # It lived in exactly ONE of the fourteen repos until now, and caught a real
  # defect the moment a shared-workflow pin reached it.
  #
  # script-ref MUST equal the pin above it: the checker is taken from
  # shared-workflows at that commit, so this repo cannot weaken its own gate by
  # editing a local copy -- there is no local copy.
  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@a53b685c1f50255e5bc7061b6080d2456351b9be # v1.18.0
    with:
      script-ref: a53b685c1f50255e5bc7061b6080d2456351b9be